# Keeps the free-tier Supabase project awake.
#
# Supabase pauses Free Plan projects after ~7 days of low database activity.
# A paused project loses its DNS record, so the app's reads fail and every
# screen renders empty (this happened on 2026-07-15 — see GOLFTRACKER.md).
#
# This workflow makes one tiny read a day, which is enough to keep the
# 7-day inactivity timer permanently reset.
#
# The key below is the *publishable* (anon) key — it is already shipped inside
# the public web bundle, so keeping it here adds no exposure. It is NOT the
# service_role key, which must never go in the repo.
#
# Note: GitHub disables scheduled workflows after 60 days with no repo
# activity. It emails first, and any commit re-enables them.

name: Supabase keep-alive

on:
  schedule:
    # 06:17 UTC daily. Off-the-hour on purpose — GitHub's cron queue is
    # busiest exactly on the hour, which delays runs.
    - cron: '17 6 * * *'
  workflow_dispatch: # lets you trigger a run by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: https://xhvqfnqeitmiqjlcrxpg.supabase.co
          SUPABASE_KEY: sb_publishable_GXb1Qv9Cg3gtrgStVCnElA_uNPHbNkH
        run: |
          set -euo pipefail

          # Read a single id from the sessions table. Enough to register as
          # user database activity, and it returns almost no data.
          status=$(curl -sS -o /tmp/body.txt -w '%{http_code}' \
            --max-time 30 --retry 3 --retry-delay 10 --retry-all-errors \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            "${SUPABASE_URL}/rest/v1/sessions?select=id&limit=1")

          echo "HTTP ${status}"
          echo "Response: $(cat /tmp/body.txt)"

          if [ "${status}" != "200" ]; then
            echo "::error::Supabase ping failed with HTTP ${status}. The project may be paused — check https://supabase.com/dashboard (MatchMind Studio org, Safari session)."
            exit 1
          fi

          echo "Supabase is awake."
